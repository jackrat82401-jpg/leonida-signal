name: Scan Twitch and publish Leonida Signal

on:
  push:
    branches: [main]
  schedule:
    # Every three hours, UTC. GitHub may delay scheduled runs.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leonida-pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Scan Twitch category and creator watchlist
        run: python3 scripts/scan_twitch.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build public site artifact
        run: |
          mkdir -p public/data
          cp index.html styles.css app.js .nojekyll public/
          cp data/latest.json public/data/latest.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the artifact to become available
        run: sleep 8
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
